{% extends 'pages/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h4 class="fw-bold mb-1">{{ post.title }}</h4>
    <p class="text-muted">{{ post.description }}</p>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Decision</label>
            {{ form.status }}
          </div>
          <div class="mb-3">
            <label class="form-label">Remarks</label>
            {{ form.remarks }}
          </div>
          <button class="btn btn-primary">Save Endorsement</button>
          <a href="{% url 'supervisor_dashboard' %}" class="btn btn-outline-secondary">Back</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
