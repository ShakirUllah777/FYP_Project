{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-5">
        <h3 class="mb-4 fw-bold text-dark text-center" style="font-size: 1.8rem;">Login</h3>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-medium mt-3">Login</button>
          <p class="text-center mt-3">No account? <a href="{% url 'register' %}">Register</a></p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
