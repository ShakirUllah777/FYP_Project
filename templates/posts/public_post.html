<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ post.title }} - CollabSpace</title>
  <meta name="description" content="{{ post.description|truncatechars:150 }}">
  <meta property="og:title" content="{{ post.title }}">
  <meta property="og:description" content="{{ post.description|truncatechars:150 }}">
  <meta property="og:type" content="article">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:640px;">
      <div class="card-body p-4">
        <span class="badge {% if post.post_type == 'fyp' %}bg-primary{% else %}bg-success{% endif %} mb-2">{{ post.get_post_type_display }}</span>
        <h2 class="fw-bold">{{ post.title }}</h2>
        <p class="text-muted small">Posted by {{ post.author.first_name }} {{ post.author.last_name }} · {{ post.created_at|date:"M d, Y" }}</p>
        <p>{{ post.description }}</p>
        <div class="d-flex flex-wrap gap-1 mb-3">
          {% for skill in post.skills_required.all %}
            <span class="badge bg-light text-dark border">{{ skill.name }}</span>
          {% endfor %}
        </div>
        <a href="/login/" class="btn btn-primary">Login to CollabSpace to respond</a>
      </div>
    </div>
  </div>
</body>
</html>
