<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CollabSpace</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">CollabSpace</a>
        <div class="ms-auto d-flex gap-2">
          {% if user.is_authenticated %}
          <a href="{% url 'tasks' %}" class="btn btn-outline-light btn-sm"
            >Tasks</a
          >
          <a href="{% url 'add_post' %}" class="btn btn-outline-light btn-sm"
            >Add Post</a
          >
          <a href="{% url 'my_posts' %}" class="btn btn-outline-light btn-sm"
            >My Posts</a
          >
          <a href="{% url 'my_profile' %}" class="btn btn-outline-light btn-sm"
            >Profile</a
          >
          <a href="{% url 'inbox' %}" class="btn btn-outline-light btn-sm">
            Messages {% if unread_count > 0 %}
            <span class="badge bg-danger">{{ unread_count }}</span>
            {% endif %}
          </a>
          <a href="{% url 'logout' %}" class="btn btn-light btn-sm">Logout</a>
          {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm"
            >Login</a
          >
          <a href="{% url 'register' %}" class="btn btn-light btn-sm"
            >Register</a
          >
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      {% if messages %} {% for msg in messages %}
      <div class="alert alert-{{ msg.tags }} alert-dismissible fade show">
        {{ msg }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>
      {% endfor %} {% endif %} {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
