{% extends 'pages/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1"><i class="bi bi-flag text-danger"></i> Report {{ reported_user.username }}</h4>
        <p class="text-muted small">Reports are reviewed by our moderation team and kept confidential.</p>
        <form method="POST">
          {% csrf_token %}
          {% if post %}<input type="hidden" name="post" value="{{ post.pk }}">{% endif %}
          <div class="mb-3">
            <label class="form-label">Reason</label>
            {{ form.reason }}
          </div>
          <div class="mb-3">
            <label class="form-label">Details</label>
            {{ form.details }}
          </div>
          <button type="submit" class="btn btn-danger">Submit Report</button>
          <a href="{% url 'user_profile' reported_user.username %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
