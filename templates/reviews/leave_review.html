{% extends 'pages/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1">Review {{ reviewed_user.first_name }} {{ reviewed_user.last_name }}</h4>
        {% if post %}<p class="text-muted small">For: {{ post.title }}</p>{% endif %}
        <form method="POST">
          {% csrf_token %}
          {% if post %}<input type="hidden" name="post" value="{{ post.pk }}">{% endif %}
          <div class="mb-3">
            <label class="form-label">Rating</label>
            {{ form.rating }}
          </div>
          <div class="mb-3">
            <label class="form-label">Comment</label>
            {{ form.comment }}
          </div>
          <button type="submit" class="btn btn-primary">{% if existing %}Update Review{% else %}Submit Review{% endif %}</button>
          <a href="{% url 'user_profile' reviewed_user.username %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
